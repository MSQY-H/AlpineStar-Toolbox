name: Build and Deploy to toolbox

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 安装 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x   # 目前最新稳定版

      - name: 安装依赖 (Deno 自动读取 package.json)
        run: deno install

      - name: 构建项目 (Vue + Vuetify)
        run: deno task build
        # 等同于 npm run build，会调用 package.json 里的 build 脚本

      - name: 添加 .nojekyll 绕过 Jekyll
        run: touch dist/.nojekyll

      - name: 部署到 toolbox 仓库
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          external_repository: ${{ github.repository_owner }}/toolbox
          publish_branch: gh-pages
          publish_dir: ./dist
          commit_message: ${{ github.event.head_commit.message }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'